name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # The workspace holds the Flutter package, its example and the showcase: Flutter 3.35.7
    # (Dart 3.9.2, sehhaty-mobile's) resolves it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      # The public libraries name every type they give (owner's decisions 68–69).
      - run: dart run tool/check_api.dart
      - run: dart test
        working-directory: packages/dzcalendar_core
      - run: flutter test
        working-directory: packages/dzcalendar
      - run: flutter test
        working-directory: apps/showcase

  conformance-copy:
    # The cases are the main repository's; the copy must be its current one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: plinthworks/dzcalendar
          path: main-repository
          sparse-checkout: conformance/cases
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.9.2
      - run: dart run tool/sync_conformance.dart --check --from main-repository
