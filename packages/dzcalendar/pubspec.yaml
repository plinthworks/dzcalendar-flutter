name: dzcalendar
description: >-
  Flutter calendar widgets: month, week, day, list, year, resource timeline and a slot picker. Every event keeps its own time zone; right to left.
version: 1.1.0
repository: https://github.com/plinthworks/dzcalendar-flutter
issue_tracker: https://github.com/plinthworks/dzcalendar-flutter/issues
topics:
  - calendar
  - timezone
  - scheduling
  - widget
  - rtl
environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"
resolution: workspace
dependencies:
  # Exactly the same version: the widgets use the core's internal.dart, outside
  # semver; both are released together (owner's decision 66).
  dzcalendar_core: 1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0
