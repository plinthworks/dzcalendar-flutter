name: dzcalendar_showcase
description: A calendar app in the spirit of macOS Calendar, built on DzCalendar to show the library — not a calendar product.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.9.0
resolution: workspace
dependencies:
  dzcalendar: ^1.0.0
  dzcalendar_core: ^1.0.0
  file_selector: ^1.0.3
  intl: ^0.20.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/
